# Netlify: builds the site at the domain root (no BASE_PATH needed).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# German and Turkish were retired: send old links to the English pages.
[[redirects]]
  from = "/de/*"
  to = "/en/:splat"
  status = 301

[[redirects]]
  from = "/tr/*"
  to = "/en/:splat"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
